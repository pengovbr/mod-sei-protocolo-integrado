name: Publish Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Distribution
        run: make dist

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: mod-sei-protocolo-integrado (versão ${{ github.ref_name }})
          body_path: dist/NOTAS_VERSAO.md
          draft: false
          prerelease: true
          files: |
            dist/${{ github.event.repository.name }}-${{ github.ref_name }}.zip
            compatibilidade.json
