name: Testes para SEI 5.1.0 Bancos oracle, mysql, sqlserver e postgres

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - 'src/**'
      - '.github/workflows/tests51.yml'
env: # Or as an environment variable
  CI: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sei: release/5.1.0
            banco: mysql
            imagembanco: processoeletronico/mariadb10.5-sei50:3.6.11
          - sei: release/5.1.0
            banco: postgresql
            imagembanco: processoeletronico/postgres15-sei50:3.6.11
    steps:
      - name: Fetch Pull Request branch
        uses: actions/checkout@v6
        with:
            repository: pengovbr/sei
            submodules: recursive
            token: ${{ secrets.GH_PAT }} # `GH_PAT` is a secret that contains your PAT
            path: sei
            ref: ${{ matrix.sei }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
            path: sei/src/sei/web/modulos/mod-protocolo-integrado

      - name: Cache Docker Image banco
        id: docker-cache
        uses: actions/cache@v5
        with:
          path: ~/docker-image-cache
          key: docker-image-${{ runner.os }}-${{ matrix.banco }}-${{ hashFiles(format('**/{0}.env', matrix.banco)) }}

      - name: Cache Docker Image outras
        id: docker-cache-outras
        uses: actions/cache@v5
        with:
          path: ~/docker-image-cache-outras
          key: docker-image-${{ runner.os }}-outras

      - name: Pull and Save Image (if cache miss)
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/docker-image-cache
          docker pull ${{ matrix.imagembanco }}
          docker save ${{ matrix.imagembanco }} -o ~/docker-image-cache/${{ matrix.banco }}.tar

      - name: Pull and Save Image (if cache miss)
        if: steps.docker-cache-outras.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/docker-image-cache-outras
          docker pull processoeletronico/app-dev-php8:3.6.11
          docker save processoeletronico/app-dev-php8:3.6.11 -o ~/docker-image-cache-outras/app-dev-php8.tar
          docker pull processoeletronico/solr9.6.1:3.6.11
          docker save processoeletronico/solr9.6.1:3.6.11 -o ~/docker-image-cache-outras/solr9.6.1.tar

      - name: Load Image (if cache hit)
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i ~/docker-image-cache/${{ matrix.banco }}.tar

      - name: Load Image (if cache hit)
        if: steps.docker-cache-outras.outputs.cache-hit == 'true'
        run: |
          docker load -i ~/docker-image-cache-outras/app-dev-php8.tar
          docker load -i ~/docker-image-cache-outras/solr9.6.1.tar

      - name: Run make test
        run: |
             sudo echo "127.0.0.1 org-http" | sudo tee -a /etc/hosts
             cd sei/src/sei/web/modulos/mod-protocolo-integrado
             make config base=${{ matrix.banco }}; make up; sleep 90s; make update; make install

      - name: Run headless test
        uses: coactions/setup-xvfb@v1
        with:
          working-directory: sei/src/sei/web/modulos/mod-protocolo-integrado
          run: make test-functional-pi
          options: "-screen 0 1920x1080x24"
