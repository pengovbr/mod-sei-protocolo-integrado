name: Testes para SEI main Bancos oracle, mysql, sqlserver e postgres

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - 'src/**/*.php'
      - 'src/composer.lock'
      - '.github/workflows/tests50.yml'
env: # Or as an environment variable
  CI: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sei: [main]
        banco: [oracle, mysql, sqlserver, postgresql]
    steps:
      - name: Fetch Pull Request branch
        uses: actions/checkout@v7
        with:
            repository: pengovbr/sei
            submodules: recursive
            token: ${{ secrets.GH_PAT }} # `GH_PAT` is a secret that contains your PAT
            path: sei
            ref: ${{ matrix.sei }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
            path: sei/src/sei/web/modulos/mod-sei-protocolo-integrado

      - name: Run make test
        run: |
             sudo echo "127.0.0.1 org-http" | sudo tee -a /etc/hosts
             cd sei/src/sei/web/modulos/mod-sei-protocolo-integrado
             make config base=${{ matrix.banco }}; make up; sleep 10s; make update; make install

      - name: Run headless test
        run: |
          cd sei/src/sei/web/modulos/mod-sei-protocolo-integrado
          xvfb-run -a -s "-screen 0 1920x1080x24" make test-functional-pi

